name: 编译并发布

# main 有新提交（含上游同步产生的提交）时编译 Release x64 并发布 GitHub Release。
# 手动运行一次会为当前 main 提交打包发布；同一提交已发布过则直接跳过。
on:
  push:
    branches: [main]
    # 只改工作流本身的提交不产生发布；上游同步触发的 workflow_dispatch 不受此限制。
    paths-ignore:
      - '.github/**'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-release
  cancel-in-progress: false

jobs:
  release:
    runs-on: windows-latest
    timeout-minutes: 360
    steps:
      - name: 检出源码
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: 计算版本号
        id: version
        shell: pwsh
        run: |
          $sha = (git rev-parse --short=7 HEAD).Trim()
          $full = (git rev-parse HEAD).Trim()
          $date = (Get-Date).ToUniversalTime().ToString('yyyy.MM.dd')
          "tag=v$date-$sha" >> $env:GITHUB_OUTPUT
          "sha=$sha"       >> $env:GITHUB_OUTPUT
          "full_sha=$full" >> $env:GITHUB_OUTPUT

      - name: 检查该提交是否已发布
        id: check
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $tag = "${{ steps.version.outputs.tag }}"
          # 版本不存在时 gh 退出码为 1，这里只把它当作判断依据，不能让它变成步骤失败。
          gh release view $tag --repo $env:GITHUB_REPOSITORY *> $null
          $exists = ($LASTEXITCODE -eq 0)
          "exists=$($exists.ToString().ToLower())" >> $env:GITHUB_OUTPUT
          if ($exists) {
            Write-Host "Release $tag 已存在，跳过本次编译。"
          } else {
            Write-Host "将发布 $tag。"
          }
          exit 0

      - name: 解析工具链路径
        id: toolchain
        if: steps.check.outputs.exists != 'true'
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # Build-Game.ps1 对新的构建目录要求显式给出 Microsoft 头库/CRT、SDK 与 ABI 版本，
          # 它本身不安装也不猜测工具链。运行器上这些组件都在，只是需要用 vswhere 解析出路径。
          $vswhere = Join-Path ${env:ProgramFiles(x86)} 'Microsoft Visual Studio\Installer\vswhere.exe'
          if (-not (Test-Path -LiteralPath $vswhere)) { throw 'vswhere.exe 不存在，无法定位 Visual Studio 的 C++ 工具。' }
          $vs = & $vswhere -latest -products * -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath
          if (-not $vs) { throw '未找到带 C++ 工具的 Visual Studio 实例。' }

          $msvc = Get-ChildItem -LiteralPath (Join-Path $vs 'VC\Tools\MSVC') -Directory |
            Sort-Object { [version]$_.Name } -Descending | Select-Object -First 1
          if (-not $msvc) { throw '未找到 MSVC 工具集目录。' }
          $cl = Join-Path $msvc.FullName 'bin\Hostx64\x64\cl.exe'
          if (-not (Test-Path -LiteralPath $cl)) { throw "未找到 cl.exe：$cl" }
          # ABI 兼容版本取 cl.exe 的 19.xx.yyyyy，与工具集目录名（14.xx.yyyyy）不是同一个号段。
          $compat = ((Get-Item -LiteralPath $cl).VersionInfo.FileVersion -split '\.')[0..2] -join '.'

          $sdkRoot = Join-Path ${env:ProgramFiles(x86)} 'Windows Kits\10'
          $sdk = Get-ChildItem -LiteralPath (Join-Path $sdkRoot 'Include') -Directory |
            Where-Object Name -match '^10\.' | Sort-Object { [version]$_.Name } -Descending | Select-Object -First 1
          if (-not $sdk) { throw '未找到 Windows SDK。' }

          $llvm = 'C:\Program Files\LLVM'
          # 运行器自带的 LLVM 主版本低于 MSVC 14.52 的 STL 门槛：yvals_core.h 的 STL1000
          # 要求 Clang 22 或更新，否则编译直接失败。这里装 README 里验收过的 22.1.3。
          $needClangMajor = 22
          $haveClangMajor = 0
          if (Test-Path -LiteralPath (Join-Path $llvm 'bin\clang-cl.exe')) {
            $line = (& (Join-Path $llvm 'bin\clang-cl.exe') --version | Select-Object -First 1)
            if ($line -match 'clang version (\d+)') { $haveClangMajor = [int]$Matches[1] }
          }
          if ($haveClangMajor -lt $needClangMajor) {
            $installer = Join-Path $env:RUNNER_TEMP 'LLVM-22.1.3-win64.exe'
            gh release download llvmorg-22.1.3 --repo llvm/llvm-project `
              --pattern 'LLVM-22.1.3-win64.exe' --dir $env:RUNNER_TEMP --clobber
            Start-Process -FilePath $installer -ArgumentList '/S' -Wait
            $line = (& (Join-Path $llvm 'bin\clang-cl.exe') --version | Select-Object -First 1)
            if ($line -notmatch 'clang version (\d+)' -or [int]$Matches[1] -lt $needClangMajor) {
              throw "LLVM 版本仍不满足要求：$line"
            }
          }

          "msvc=$($msvc.FullName)" >> $env:GITHUB_OUTPUT
          "sdkRoot=$sdkRoot"        >> $env:GITHUB_OUTPUT
          "sdkVersion=$($sdk.Name)" >> $env:GITHUB_OUTPUT
          "compat=$compat"          >> $env:GITHUB_OUTPUT
          "llvm=$llvm"              >> $env:GITHUB_OUTPUT
          Write-Host "MSVC=$($msvc.FullName)`nSDK=$sdkRoot\$($sdk.Name)`nABI=$compat`nLLVM=$llvm"

      - name: 编译 Release x64
        if: steps.check.outputs.exists != 'true'
        shell: pwsh
        run: |
          ./tools/Build-Game.ps1 `
            -MSVCRoot "${{ steps.toolchain.outputs.msvc }}" `
            -WindowsSDKRoot "${{ steps.toolchain.outputs.sdkRoot }}" `
            -WindowsSDKVersion "${{ steps.toolchain.outputs.sdkVersion }}" `
            -MSVCCompatibilityVersion "${{ steps.toolchain.outputs.compat }}" `
            -LLVMRoot "${{ steps.toolchain.outputs.llvm }}"

      - name: 打印构建日志
        if: failure() && steps.check.outputs.exists != 'true'
        shell: pwsh
        run: |
          # 编译脚本把 detail 写进 deployment-stage/<时间>-<id>/，不直接回显；失败时把关键文件摊开。
          $stages = Get-ChildItem -Path build -Directory -Recurse -Filter 'deployment-stage' -ErrorAction SilentlyContinue
          if (-not $stages) { Write-Host '未找到 deployment-stage 目录。'; exit 0 }
          $run = Get-ChildItem -Path $stages[0].FullName -Directory | Sort-Object Name -Descending | Select-Object -First 1
          Write-Host "stage: $($run.FullName)"
          foreach ($name in @('failure.json', 'build.stderr.log', 'build.stdout.log')) {
            $file = Join-Path $run.FullName $name
            if (Test-Path -LiteralPath $file) {
              Write-Host "----- $name -----"
              Get-Content -LiteralPath $file -Tail 200
            }
          }

      - name: 打包
        id: package
        if: steps.check.outputs.exists != 'true'
        shell: pwsh
        run: |
          $tag = "${{ steps.version.outputs.tag }}"
          if (-not (Test-Path bin/concord_runtime.exe)) { throw '缺少 bin/concord_runtime.exe，编译未产出游戏核心。' }
          if (-not (Test-Path bin/BinkFrameExtractor.exe)) { throw '缺少 bin/BinkFrameExtractor.exe，编译未产出视频桥接工具。' }

          $stage = "dist/ConcordRTS-$tag"
          New-Item -ItemType Directory -Force -Path $stage | Out-Null
          # 保留 bin/ 目录结构，解压后与仓库内的启动方式一致（README 里的 .\bin\concord_runtime.exe）。
          Copy-Item bin -Destination $stage -Recurse
          Copy-Item README.md, LICENSE $stage

          Get-ChildItem $stage -Recurse -File |
            ForEach-Object { "$($_.FullName.Substring((Resolve-Path $stage).Path.Length + 1))  $($_.Length) 字节" } |
            Sort-Object

          $zip = "dist/ConcordRTS-$tag-win64.zip"
          Compress-Archive -Path $stage -DestinationPath $zip -Force

          "$(Split-Path $zip -Leaf)  $((Get-FileHash $zip -Algorithm SHA256).Hash.ToLower())" |
            Set-Content -Path dist/SHA256SUMS.txt -Encoding utf8
          "zip=$zip" >> $env:GITHUB_OUTPUT

      - name: 生成发布说明
        if: steps.check.outputs.exists != 'true'
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $tag = "${{ steps.version.outputs.tag }}"
          $sha = "${{ steps.version.outputs.full_sha }}"
          # git 的提交信息是 UTF-8，显式指定解码方式，避免运行器代码页不同导致中文乱码。
          [Console]::OutputEncoding = [System.Text.UTF8Encoding]::new()

          $previous = (gh release list --repo $env:GITHUB_REPOSITORY --limit 1 --json tagName --jq '.[0].tagName') | Select-Object -First 1
          if ([string]::IsNullOrWhiteSpace($previous)) {
            $range = 'HEAD'
            $rangeLabel = '（首次发布，列出最近 30 次提交）'
            $log = (git log -30 --pretty=format:'- %h %s') -join "`n"
          } else {
            $range = "$previous..HEAD"
            $rangeLabel = '（`{0}` → `{1}`）' -f $previous, $tag
            $log = (git log $range --pretty=format:'- %h %s') -join "`n"
          }
          if ([string]::IsNullOrWhiteSpace($log)) { $log = "- $sha 无新增提交" }

          @"
          C++20 RTS 引擎源码的自行编译版本，对应本仓库提交 ``$sha``。

          ## 构建信息

          | 项 | 值 |
          | --- | --- |
          | 版本 | ``$tag`` |
          | 提交 | [$sha]($env:GITHUB_SERVER_URL/$env:GITHUB_REPOSITORY/commit/$sha) |
          | 上游仓库 | [AdrianLuo-X/ConcordRTS]($env:GITHUB_SERVER_URL/AdrianLuo-X/ConcordRTS) |
          | 构建环境 | windows-latest，MSVC x64 Release（CMake + Visual Studio） |
          | 构建时间（UTC） | $((Get-Date).ToUniversalTime().ToString('yyyy-MM-dd HH:mm:ss')) |

          ## 本次变更
          $rangeLabel

          $log

          ## 压缩包内容

          ``ConcordRTS-$tag-win64.zip`` 解压后得到 ``ConcordRTS-$tag/`` 目录：

          - ``bin/concord_runtime.exe``：游戏核心（64 位）
          - ``bin/BinkFrameExtractor.exe``：视频桥接工具（32 位）
          - ``bin/msvcp140*.dll``、``bin/vcruntime140*.dll``：Visual Studio 运行库，与 exe 同目录
          - ``README.md``、``LICENSE``

          ``SHA256SUMS.txt`` 是该 zip 的 SHA-256 校验值。启动方式和参数见 ``README.md``；源码与示例（``samples/``、``tests/``）请使用 Release 页面自动生成的源码压缩包。

          ## 使用与声明

          - 压缩包是 Windows x64 的自行编译产物，运行前请按 ``README.md`` 准备自己的游戏数据（``RedAlert2/``、``local_data/``）；本发布不包含原版游戏程序、素材、地图或影片。
          - 这是上游项目源码的 fork 构建，非官方发布；上游源码采用 GPL-3.0-only，再分发请遵守该许可证及其对原版素材的说明。
          - 编译产物按现状提供，不附带任何保证。
          "@ | Set-Content -Path dist/RELEASE_NOTES.md -Encoding utf8
          # 首次发布时 gh release list 会以非零码退出，不能让它影响步骤结果。
          exit 0

      - name: 发布 Release
        if: steps.check.outputs.exists != 'true'
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $tag = "${{ steps.version.outputs.tag }}"
          gh release create $tag `
            --repo $env:GITHUB_REPOSITORY `
            --target "${{ steps.version.outputs.full_sha }}" `
            --title $tag `
            --notes-file dist/RELEASE_NOTES.md `
            "${{ steps.package.outputs.zip }}" `
            dist/SHA256SUMS.txt

      - name: 汇总
        if: always()
        shell: pwsh
        run: |
          $summary = @(
            '### 编译与发布'
            ''
            '| 项 | 值 |'
            '| --- | --- |'
            "| 版本 | ``${{ steps.version.outputs.tag }}`` |"
            "| 提交 | ``${{ steps.version.outputs.full_sha }}`` |"
            "| 该提交已发布过 | ${{ steps.check.outputs.exists == 'true' && '是' || '否' }} |"
            "| 触发方式 | ${{ github.event_name }} |"
          ) -join "`n"
          Add-Content -Path $env:GITHUB_STEP_SUMMARY -Value $summary
